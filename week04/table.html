<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Feature Comparison</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        caption {
            caption-side: top;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        thead {
            background-color: #2c3e50;
            color: white;
        }

        /* Zebra Striping */
        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:hover {
            background-color: #dfe6e9;
        }
    </style>
</head>

<body>

    <table>
        <caption>Table 1: Account Feature Comparison</caption>

        <thead>
            <tr>
                <th>Features</th>
                <th>Basic</th>
                <th>Premium</th>
                <th>Enterprise</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>24/7 Support</td>
                <td>❌</td>
                <td>✔️</td>
                <td>✔️</td>
            </tr>

            <tr>
                <td>Cloud Storage</td>
                <td>✔️</td>
                <td>✔️</td>
                <td>✔️</td>
            </tr>

            <tr>
                <td>Custom Reports</td>
                <td>❌</td>
                <td>✔️</td>
                <td>✔️</td>
            </tr>

            <tr>
                <td>Unlimited Users</td>
                <td>❌</td>
                <td>❌</td>
                <td>✔️</td>
            </tr>

            <tr>
                <td>Security Backup</td>
                <td>✔️</td>
                <td>✔️</td>
                <td>✔️</td>
            </tr>
        </tbody>

    </table>

</body>
</html>
