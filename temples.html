<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <meta name="description"
        content="Temple Album showcasing a collection of temples with images and captions, built using HTML, CSS, and JavaScript for a responsive design.">
    <meta name="author" content="Liedson Nhapulo">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@500;700&display=swap"

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
</head>

<body>
    <header>
        <h2>Temple Album</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h1>Temples</h1>

        <div class="gallery">
            <figure>
                <img src="images/accra_ghana.jpeg" alt="Accra Ghana Temple">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>

            <figure>
                <img src="images/cape_town.jpg" alt="Cape Town Temple">

            <figure>
                <img src="images/durban.jpg" alt="Durban Temple">

            </figure>

            <figure>
                <img src="images/johannesburg.jpg" alt="Johannesburg Temple">

            <figure>
                <img src="images/san_diego_california.jpg" alt="San Diego California Temple">
                <figcaption>San Diego California Temple</figcaption>

            <figure>
                <img src="images/oakland_california.jpg" alt="Oakland California Temple">
                <figcaption>Oakland California Temple</figcaption>
            </figure>

            <figure>
                <img src="images/rexburg_idaho.jpg" alt="Rexburg Idaho Temple">
                <figcaption>Rexburg Idaho Temple</figcaption>
            </figure>

            <figure>
                <img src="images/salt_lake.jpg" alt="Salt Lake Temple">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure>
                <img src="images/washingtondc.jpg" alt="Washington DC Temple">

    </main>

    <footer>
        <p>&copy; <span id="year"></span> Temple Album | All Rights Reserved</p>
